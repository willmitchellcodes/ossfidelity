<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https:; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#0F1A14">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/inter-var-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/heal.js' | relative_url }}"></script>
</head>
<body data-base="{{ site.baseurl }}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main"><div class="wrap">
{{ content }}
  </div></main>
  {% include footer.html %}
  {% for s in page.scripts %}<script type="module" src="{{ s | relative_url }}"></script>
  {% endfor %}
</body>
</html>
