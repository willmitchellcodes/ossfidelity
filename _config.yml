title: OSS Fidelity
tagline: Check open source before you trust it.
description: >-
  Paste a link or search for an open source project and get plain-English grades
  for reliability, maintenance, and security, plus every reason behind them.
# url and baseurl are deliberately NOT set here. GitHub Pages fills them in from the
# repository's Pages settings ("/ossfidelity" on github.io, "" on a custom domain), and
# .github/workflows/pages.yml sets them explicitly, so either kind of build gets them right.
lang: en
source_repo: https://github.com/willmitchellcodes/ossfidelity
# Optional: address of the GitHub proxy in proxy/ (a Cloudflare Worker), with no trailing slash,
# e.g. https://ossfidelity-github-proxy.<you>.workers.dev. Live checks and search use it when set,
# and go straight to GitHub when it's blank or unreachable.
github_proxy: "https://ossfidelity-github-proxy.ossfidelity.workers.dev"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
permalink: pretty

exclude:
  - docs/
  - scripts/
  - proxy/
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
