name: Deploy site
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Weekly scoring"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # Build for wherever GitHub serves the site: "" on ossfidelity.com,
      # "/ossfidelity" on willmitchellcodes.github.io while no custom domain is active.
      - name: Set site address
        run: |
          sed -i -E '/^(url|baseurl):/d' _config.yml
          printf '\nurl: "%s"\nbaseurl: "%s"\n' "${{ steps.pages.outputs.origin }}" "${{ steps.pages.outputs.base_path }}" >> _config.yml
          tail -n 2 _config.yml
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
