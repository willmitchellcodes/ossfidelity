name: Weekly scoring
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  # Also regrade whenever the curated list, the weights, or the formula changes.
  push:
    branches: [main]
    paths:
      - "_data/projects.yml"
      - "_data/weights.json"
      - "assets/js/lib/**"
      - "scripts/score.mjs"
      - "scripts/models.mjs"
      - ".github/workflows/score.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Score just one project, e.g. github.com/llvm/llvm-project (leave blank for all)"
        required: false

permissions:
  contents: write

concurrency:
  group: scoring

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Optional: a GitHub App token (5,000 requests/hour, separate from anyone's personal
      # budget, expires after an hour). Skipped until the App is set up; see README.
      - name: Get a GitHub App token
        id: app
        if: ${{ vars.SCORER_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCORER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCORER_APP_PRIVATE_KEY }}
      - name: Score projects
        run: node scripts/score.mjs ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
        env:
          # First available of: the App token, a read-only fine-grained token saved as
          # SCORER_TOKEN (5,000/hour), or the default token (1,000/hour). Only scoring uses it;
          # checkout and the commit below keep the default token.
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.SCORER_TOKEN || github.token }}
      - name: Refresh open-model facts from Hugging Face
        run: node scripts/models.mjs
        continue-on-error: true
      - name: Commit new scores
        run: |
          git config user.name "ossfidelity-scorer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scores.json _data/model_facts.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Weekly scores $(date -u +%F)"
          git pull --rebase origin main
          git push
