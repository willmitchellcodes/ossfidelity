name: Tests
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "scripts/**"
      - "proxy/**"
      - "_data/weights.json"
      - "package.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
