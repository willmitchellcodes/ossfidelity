# Open-weight models small enough for a student laptop.
# Openness follows the OSI Open Source AI Definition's three required parts (https://opensource.org/ai/open-source-ai-definition):
#   weights: 1 = OSI-approved license · 0.5 = open weights with use restrictions · 0 = research/non-commercial only
#   code:    1 = training and inference code · 0.5 = inference only · 0 = none
#   data:    1 = training data released or described in detail · 0.5 = summarized · 0 = undisclosed
# status: draft = from model cards and research notes, not yet checked against the
#         European Open Source AI Index (https://osai-index.eu/) and each model card; verified = both checked.
# params_b: total parameters in billions. RAM estimate at 4-bit ≈ params × 0.5 GB (weights only), plus overhead.
updated: 2026-10-21
models:
  - name: OLMo 2 7B
    maker: Ai2 (nonprofit)
    params_b: 7
    license: Apache-2.0
    openness: { weights: 1, code: 1, data: 1 }
    status: draft
    link: https://huggingface.co/allenai/OLMo-2-1124-7B
  - name: SmolLM3 3B
    maker: Hugging Face
    params_b: 3
    license: Apache-2.0
    openness: { weights: 1, code: 1, data: 1 }
    status: draft
    link: https://huggingface.co/HuggingFaceTB/SmolLM3-3B
  - name: Granite 3.3 8B
    maker: IBM
    params_b: 8
    license: Apache-2.0
    openness: { weights: 1, code: 0.5, data: 0.5 }
    status: draft
