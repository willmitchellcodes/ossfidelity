  - name: Qwen3 4B
    maker: Alibaba
    params_b: 4
    license: Apache-2.0
    openness: { weights: 1, code: 0.5, data: 0 }
    status: draft
    link: https://huggingface.co/Qwen/Qwen3-4B
  - name: Phi-4-mini
    maker: Microsoft
    params_b: 3.8
    license: MIT
    openness: { weights: 1, code: 0.5, data: 0.5 }
    status: draft
    link: https://huggingface.co/microsoft/Phi-4-mini-instruct
  - name: gpt-oss-20b
    maker: OpenAI
    params_b: 21
    license: Apache-2.0
    openness: { weights: 1, code: 0.5, data: 0 }
    status: draft
    link: https://huggingface.co/openai/gpt-oss-20b
  - name: Llama 3.2 3B
    maker: Meta
