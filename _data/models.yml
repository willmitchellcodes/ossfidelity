    license: Gemma Terms of Use
    openness: { weights: 0.5, code: 0.5, data: 0 }
    status: draft
    link: https://huggingface.co/google/gemma-3-4b-it

tasks:
  - id: format
    label: Follows the rules
    what: Word limits, valid JSON, "no commas", all checked by a script (IFEval-style).
  - id: grounded
    label: Sticks to the source
    what: Answers questions from a passage we provide, scored by exact match.
  - id: unanswerable
    label: Admits "not in the text"
    what: When the passage doesn't contain the answer, the model should say so instead of making one up.
  - id: consistency
    label: Same answer twice
    what: Each question asked three times. Do the answers agree?
