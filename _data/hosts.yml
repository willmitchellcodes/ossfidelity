# Host checks: about the platform where the code lives, not the project.
# They're shown next to the project's grades and never mixed into them.
# pass: true / false / null (null means we couldn't find a public answer, shown as "unknown")
# Each check needs a source. Last reviewed: 2026-10-21.

github.com:
  name: GitHub
  operator: GitHub, Inc., owned by Microsoft
  checks:
    - id: nonprofit
      pass: false
      detail: A for-profit subsidiary of Microsoft since 2018.
      source: https://news.microsoft.com/2018/06/04/microsoft-to-acquire-github-for-7-5-billion/
    - id: no_ai_training
      pass: false
      detail: >-
        Public GitHub code was used to train Codex, the model behind the first Copilot.
        Since April 24, 2026, Copilot Free/Pro/Pro+ interaction data (including code snippets) trains models
        unless you opt out. GitHub says private repositories "at rest" are not used.
      source: https://github.blog/news-insights/company-news/updates-to-github-copilot-interaction-data-usage-policy/
      source2: https://arxiv.org/abs/2107.03374
    - id: open_platform
      pass: false
      detail: GitHub's platform software is proprietary.
      source: https://en.wikipedia.org/wiki/GitHub
    - id: scraper_defense
      pass: false
      detail: We found no public commitment to block AI crawlers from hosted code (as of Oct 2026).
      source: null

labels:
  nonprofit: Run by a nonprofit
  no_ai_training: Promises not to train AI on hosted code
  open_platform: The platform itself is open source
  scraper_defense: Defends against AI scrapers
